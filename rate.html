<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Vivra</title>
<meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.macjohnson.vivra">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    --bg: #0A0A15;
    --violet: #7C3AED;
    --cyan: #0EA5E9;
    --white70: rgba(255,255,255,0.7);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .logo-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
  }
  p { color: var(--white70); font-size: 15px; margin-top: 8px; }
  a { color: var(--cyan); }
</style>
</head>
<body>
  <div>
    <div class="logo-icon">V</div>
    <p>Taking you to Vivra on Google Play...</p>
    <p><a href="https://play.google.com/store/apps/details?id=com.macjohnson.vivra">Tap here if you are not redirected</a></p>
  </div>
  <script>
    window.location.replace("https://play.google.com/store/apps/details?id=com.macjohnson.vivra");
  </script>
</body>
</html>
